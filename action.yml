name: 'NoyanSecOps'
description: 'Enterprise DevSecOps Security Pipeline - SAST, SCA, Secrets, IaC and Container Security'
author: 'NoyanSecOps'

branding:
  icon: shield
  color: blue

inputs:

  github_token:
    description: 'GitHub Token for SARIF upload and API access'
    required: true

  fail_policy:
    description: 'Fail pipeline when security findings are detected'
    required: false
    default: 'false'

  severity:
    description: 'Security severity levels'
    required: false
    default: 'CRITICAL,HIGH'

  retention_days:
    description: 'Artifact retention days'
    required: false
    default: '14'


  run_gitleaks:
    description: 'Enable Secret Scanning'
    required: false
    default: 'true'

  run_semgrep:
    description: 'Enable SAST scanning'
    required: false
    default: 'true'

  run_trivy:
    description: 'Enable SCA scanning'
    required: false
    default: 'true'

  run_checkov:
    description: 'Enable IaC scanning'
    required: false
    default: 'true'

  run_hadolint:
    description: 'Enable Dockerfile scanning'
    required: false
    default: 'true'


# Tool Versions

  gitleaks_version:
    description: 'Gitleaks Action version'
    required: false
    default: 'v2'

  semgrep_version:
    description: 'Semgrep Action version'
    required: false
    default: 'v1'

  trivy_action_version:
    description: 'Trivy Action version'
    required: false
    default: 'v0.20.0'

  trivy_version:
    description: 'Trivy CLI version'
    required: false
    default: 'v0.36.0'

  checkov_version:
    description: 'Checkov Action version'
    required: false
    default: 'v12.1347.0'

  hadolint_version:
    description: 'Hadolint Action version'
    required: false
    default: 'v3.1.0'


# Config Files

  semgrep_config:
    description: 'Custom Semgrep config file'
    required: false

  trivy_config:
    description: 'Custom Trivy config file'
    required: false

  trivy_ignore_file:
    description: 'Custom Trivy ignore file'
    required: false

  checkov_config:
    description: 'Custom Checkov config file'
    required: false

  hadolint_config:
    description: 'Custom Hadolint config file'
    required: false


runs:
  using: composite

  steps:


# ==================================
# Prepare
# ==================================

    - name: Prepare NoyanSecOps Workspace
      shell: bash
      run: |
        mkdir -p noyansecops-results
        echo "NoyanSecOps Security Pipeline Started"



# ==================================
# Cache
# ==================================

    - name: Cache Trivy Database
      if: inputs.run_trivy == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/trivy
        key: trivy-${{ runner.os }}-${{ inputs.trivy_version }}


    - name: Cache Semgrep
      if: inputs.run_semgrep == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.semgrep
        key: semgrep-${{ runner.os }}


    - name: Cache Python Packages
      if: inputs.run_checkov == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}



# ==================================
# Config Discovery
# ==================================

    - name: Discover Security Config Files
      shell: bash
      run: |

        echo "Searching security configuration files..."


        if [ -n "${{ inputs.semgrep_config }}" ]; then
          echo "SEMGRP_CONFIG=${{ inputs.semgrep_config }}" >> $GITHUB_ENV

        elif [ -f ".semgrep.yml" ]; then
          echo "SEMGRP_CONFIG=.semgrep.yml" >> $GITHUB_ENV

        elif [ -f ".semgrep.yaml" ]; then
          echo "SEMGRP_CONFIG=.semgrep.yaml" >> $GITHUB_ENV

        else
          echo "SEMGRP_CONFIG=" >> $GITHUB_ENV
        fi



        if [ -n "${{ inputs.trivy_config }}" ]; then
          echo "TRIVY_CONFIG=${{ inputs.trivy_config }}" >> $GITHUB_ENV

        elif [ -f "trivy.yaml" ]; then
          echo "TRIVY_CONFIG=trivy.yaml" >> $GITHUB_ENV

        elif [ -f ".trivy.yaml" ]; then
          echo "TRIVY_CONFIG=.trivy.yaml" >> $GITHUB_ENV

        else
          echo "TRIVY_CONFIG=" >> $GITHUB_ENV
        fi



        if [ -n "${{ inputs.trivy_ignore_file }}" ]; then
          echo "TRIVY_IGNORE=${{ inputs.trivy_ignore_file }}" >> $GITHUB_ENV

        elif [ -f ".trivyignore" ]; then
          echo "TRIVY_IGNORE=.trivyignore" >> $GITHUB_ENV

        else
          echo "TRIVY_IGNORE=" >> $GITHUB_ENV
        fi



        if [ -n "${{ inputs.checkov_config }}" ]; then
          echo "CHECKOV_CONFIG=${{ inputs.checkov_config }}" >> $GITHUB_ENV

        elif [ -f ".checkov.yml" ]; then
          echo "CHECKOV_CONFIG=.checkov.yml" >> $GITHUB_ENV

        elif [ -f ".checkov.yaml" ]; then
          echo "CHECKOV_CONFIG=.checkov.yaml" >> $GITHUB_ENV

        else
          echo "CHECKOV_CONFIG=" >> $GITHUB_ENV
        fi



        if [ -n "${{ inputs.hadolint_config }}" ]; then
          echo "HADOLINT_CONFIG=${{ inputs.hadolint_config }}" >> $GITHUB_ENV

        elif [ -f ".hadolint.yaml" ]; then
          echo "HADOLINT_CONFIG=.hadolint.yaml" >> $GITHUB_ENV

        elif [ -f ".hadolint.yml" ]; then
          echo "HADOLINT_CONFIG=.hadolint.yml" >> $GITHUB_ENV

        else
          echo "HADOLINT_CONFIG=" >> $GITHUB_ENV
        fi



# ==================================
# Validation Layer
# ==================================

    - name: Validate NoyanSecOps Configuration
      shell: bash
      run: |

        echo "Running configuration validation..."

        FAILED=0


        if [ ! -d "noyansecops-results" ]; then

          echo "Report directory missing"

          FAILED=1

        fi



        if [ -n "${SEMGRP_CONFIG}" ] && [ ! -f "${SEMGRP_CONFIG}" ]; then

          echo "Semgrep config not found: ${SEMGRP_CONFIG}"

          FAILED=1

        fi



        if [ -n "${TRIVY_CONFIG}" ] && [ ! -f "${TRIVY_CONFIG}" ]; then

          echo "Trivy config not found: ${TRIVY_CONFIG}"

          FAILED=1

        fi



        if [ -n "${TRIVY_IGNORE}" ] && [ ! -f "${TRIVY_IGNORE}" ]; then

          echo "Trivy ignore file not found: ${TRIVY_IGNORE}"

          FAILED=1

        fi



        if [[ "${{ inputs.fail_policy }}" != "true" &&
              "${{ inputs.fail_policy }}" != "false" ]]; then

          echo "Invalid fail_policy value"

          FAILED=1

        fi



        for LEVEL in $(echo "${{ inputs.severity }}" | tr ',' ' ')
        do

          case "$LEVEL" in

            CRITICAL|HIGH|MEDIUM|LOW|UNKNOWN)
              ;;

            *)
              echo "Invalid severity: $LEVEL"
              FAILED=1
              ;;

          esac

        done



        if [ "$FAILED" -eq 1 ]; then

          echo "NoyanSecOps validation failed"

          exit 1

        fi


        echo "NoyanSecOps validation completed successfully"

# ==================================
# Secret Scanning - Gitleaks
# ==================================

    - name: Run Gitleaks Secret Scan
      if: inputs.run_gitleaks == 'true'
      uses: gitleaks/gitleaks-action@v2
      continue-on-error: ${{ inputs.fail_policy != 'true' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        GITLEAKS_ENABLE_SUMMARY: true



# ==================================
# SAST - Semgrep
# ==================================

    - name: Run Semgrep SAST
      if: inputs.run_semgrep == 'true'
      uses: semgrep/semgrep-action@v1
      continue-on-error: ${{ inputs.fail_policy != 'true' }}
      with:
        generateSarif: "1"
        config: ${{ env.SEMGRP_CONFIG != '' && env.SEMGRP_CONFIG || 'p/default' }}



    - name: Move Semgrep SARIF
      if: always() && inputs.run_semgrep == 'true'
      shell: bash
      run: |

        if [ -f "semgrep.sarif" ]; then

          mv semgrep.sarif noyansecops-results/semgrep.sarif

        fi



    - name: Upload Semgrep SARIF
      if: always() && inputs.run_semgrep == 'true'
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: noyansecops-results/semgrep.sarif
        category: noyansecops-semgrep




# ==================================
# SCA - Trivy
# ==================================

    - name: Run Trivy Filesystem Scan
      if: inputs.run_trivy == 'true'
      uses: aquasecurity/trivy-action@v0.20.0
      continue-on-error: ${{ inputs.fail_policy != 'true' }}
      with:

        version: ${{ inputs.trivy_version }}

        scan-type: fs

        format: sarif

        output: noyansecops-results/trivy.sarif

        severity: ${{ inputs.severity }}

        exit-code: ${{ inputs.fail_policy == 'true' && '1' || '0' }}

        ignore-unfixed: true

        trivyignores: ${{ env.TRIVY_IGNORE }}



    - name: Run Trivy With Custom Config
      if: always() && inputs.run_trivy == 'true' && env.TRIVY_CONFIG != ''
      shell: bash
      run: |

        trivy fs \
          --config "${TRIVY_CONFIG}" \
          --format sarif \
          --output noyansecops-results/trivy.sarif \
          .



    - name: Upload Trivy SARIF
      if: always() && inputs.run_trivy == 'true'
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:

        sarif_file: noyansecops-results/trivy.sarif

        category: noyansecops-trivy




# ==================================
# IaC - Checkov
# ==================================

    - name: Run Checkov IaC Scan
      if: inputs.run_checkov == 'true'
      uses: bridgecrewio/checkov-action@v12.1347.0
      continue-on-error: ${{ inputs.fail_policy != 'true' }}
      with:

        directory: .

        output_format: sarif

        output_file_path: noyansecops-results/checkov.sarif

        soft_fail: ${{ inputs.fail_policy != 'true' }}

        config_file: ${{ env.CHECKOV_CONFIG }}



    - name: Upload Checkov SARIF
      if: always() && inputs.run_checkov == 'true'
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:

        sarif_file: noyansecops-results/checkov.sarif

        category: noyansecops-checkov




# ==================================
# Dockerfile Security - Hadolint
# ==================================

    - name: Detect Dockerfile
      if: inputs.run_hadolint == 'true'
      shell: bash
      run: |

        if find . -name "Dockerfile*" | grep -q Dockerfile; then

          echo "DOCKERFILE_EXISTS=true" >> $GITHUB_ENV

        else

          echo "DOCKERFILE_EXISTS=false" >> $GITHUB_ENV

        fi




    - name: Run Hadolint
      if: inputs.run_hadolint == 'true' && env.DOCKERFILE_EXISTS == 'true'
      uses: hadolint/hadolint-action@v3.1.0
      continue-on-error: ${{ inputs.fail_policy != 'true' }}
      with:

        recursive: true

        format: sarif

        output-file: noyansecops-results/hadolint.sarif

        no-fail: ${{ inputs.fail_policy != 'true' }}



    - name: Upload Hadolint SARIF
      if: always() && inputs.run_hadolint == 'true'
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:

        sarif_file: noyansecops-results/hadolint.sarif

        category: noyansecops-hadolint

# ==================================
# Upload Security Reports
# ==================================

    - name: Upload NoyanSecOps Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:

        name: noyansecops-security-reports

        path: noyansecops-results/

        retention-days: ${{ inputs.retention_days }}



# ==================================
# Security Summary
# ==================================

    - name: Generate Security Summary
      if: always()
      shell: bash
      run: |

        echo "# 🛡️ NoyanSecOps Security Report" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "## Scanner Status" >> $GITHUB_STEP_SUMMARY

        echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY

        echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY

        echo "| Gitleaks | ${{ inputs.run_gitleaks }} |" >> $GITHUB_STEP_SUMMARY

        echo "| Semgrep | ${{ inputs.run_semgrep }} |" >> $GITHUB_STEP_SUMMARY

        echo "| Trivy | ${{ inputs.run_trivy }} |" >> $GITHUB_STEP_SUMMARY

        echo "| Checkov | ${{ inputs.run_checkov }} |" >> $GITHUB_STEP_SUMMARY

        echo "| Hadolint | ${{ inputs.run_hadolint }} |" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "Severity Policy: ${{ inputs.severity }}" >> $GITHUB_STEP_SUMMARY

        echo "Fail Policy: ${{ inputs.fail_policy }}" >> $GITHUB_STEP_SUMMARY




# ==================================
# Security Gate
# ==================================

    - name: Apply NoyanSecOps Security Gate
      if: inputs.fail_policy == 'true'
      shell: bash
      run: |

        echo "Checking SARIF security findings..."

        FAILED=0


        for FILE in noyansecops-results/*.sarif
        do

          if [ -f "$FILE" ]; then


            echo "Analyzing $FILE"


            RESULT=$(jq '

            [
              .runs[]
              .results[]
              |
              select(
                .level == "error" or
                .level == "warning"
              )
            ]
            |
            length

            ' "$FILE")


            if [ "$RESULT" -gt 0 ]; then

              echo "Security findings detected in $FILE"

              FAILED=1

            fi


          fi

        done



        if [ "$FAILED" -eq 1 ]; then

          echo "❌ NoyanSecOps Security Gate Failed"

          exit 1

        fi



        echo "✅ NoyanSecOps Security Gate Passed"
